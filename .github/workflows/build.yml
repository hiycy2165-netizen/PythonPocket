name: PythonPocket APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Projeyi al
        uses: actions/checkout@v4

      - name: Python'u ayarla
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Java'yı ayarla
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Gerekli paketleri kur
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev automake

      - name: Buildozer kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.34

      - name: APK oluştur
        run: |
          yes | buildozer android debug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: PythonPocket-APK
          path: bin/*.apk
